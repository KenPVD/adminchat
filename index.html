<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XGAME Admin Chat</title>

<style>
:root {
    --bg: #0b1020;
    --panel: #111827;
    --panel-2: #151d2f;
    --panel-3: #1b2538;
    --border: rgba(255,255,255,.08);
    --text: #f8fafc;
    --muted: #94a3b8;
    --blue: #3b82f6;
    --blue-2: #2563eb;
    --green: #22c55e;
    --danger: #ef4444;
    --shadow: 0 20px 60px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
}

body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(59,130,246,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(99,102,241,.10),
            transparent 28%
        ),
        var(--bg);

    color: var(--text);
    overflow: hidden;
}

/* =========================
   CHAT APP
========================= */

.chat-app {
    width: 100%;
    max-width: 560px;

    height: 100vh;
    height: 100dvh;

    min-height: 0;

    margin: auto;

    background: rgba(17,24,39,.96);

    display: flex;
    flex-direction: column;

    color: var(--text);

    box-shadow: var(--shadow);

    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);

    position: relative;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    height: 70px;
    min-height: 70px;

    flex-shrink: 0;

    background: rgba(21,29,47,.96);

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 10px 14px;

    position: relative;
    z-index: 10;

    backdrop-filter: blur(16px);
}

.avatar {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: 800;

    margin-right: 11px;

    box-shadow:
        0 4px 18px rgba(59,130,246,.25);

    flex-shrink: 0;
}

.user-info {
    flex: 1;
    min-width: 0;
}

.user-name {
    font-size: 15px;
    font-weight: 750;

    letter-spacing: .1px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    font-size: 12px;

    color: var(--muted);

    margin-top: 3px;

    display: flex;
    align-items: center;
}

.status::before {
    content: "";

    width: 7px;
    height: 7px;

    display: inline-block;

    border-radius: 50%;

    background: var(--green);

    margin-right: 5px;

    box-shadow:
        0 0 0 3px rgba(34,197,94,.10);
}

/* =========================
   HEADER BUTTON
========================= */

.header-btn {
    width: 38px;
    height: 38px;

    border: none;

    background: transparent;

    color: #60a5fa;

    font-size: 19px;

    cursor: pointer;

    border-radius: 11px;

    transition: .18s ease;

    flex-shrink: 0;
}

.header-btn:hover {
    background: rgba(59,130,246,.12);

    color: #93c5fd;

    transform: translateY(-1px);
}

/* =========================
   MESSAGES
========================= */

.messages {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 18px 14px;

    display: flex;
    flex-direction: column;

    gap: 8px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(59,130,246,.035),
            transparent 32%
        ),
        transparent;
}

.messages::-webkit-scrollbar {
    width: 6px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 20px;
}

/* =========================
   MESSAGE
========================= */

.message {
    max-width: 78%;

    padding: 10px 14px;

    border-radius: 17px;

    font-size: 14px;

    line-height: 1.45;

    word-wrap: break-word;
    overflow-wrap: anywhere;

    white-space: pre-wrap;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);
}

.message.user {
    align-self: flex-start;

    background: #273244;

    color: #e5e7eb;

    border: 1px solid rgba(255,255,255,.045);

    border-bottom-left-radius: 6px;
}

.message.admin {
    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-2)
        );

    color: white;

    border-bottom-right-radius: 6px;

    box-shadow:
        0 5px 18px rgba(37,99,235,.20);
}

/* =========================
   EMPTY
========================= */

.empty {
    margin: auto;

    color: #64748b;

    font-size: 14px;

    text-align: center;
}

/* =========================
   INPUT
========================= */

.input-area {
    min-height: 66px;

    flex-shrink: 0;

    background: rgba(21,29,47,.98);

    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 9px 10px;

    gap: 3px;

    position: relative;

    z-index: 10;

    backdrop-filter: blur(16px);
}

.tool {
    width: 38px;
    min-width: 38px;

    height: 40px;

    border: none;

    background: transparent;

    color: #94a3b8;

    font-size: 19px;

    cursor: pointer;

    border-radius: 11px;

    transition: .18s ease;

    flex-shrink: 0;
}

.tool:hover {
    color: #60a5fa;

    background: rgba(59,130,246,.10);
}

.input {
    flex: 1;

    min-width: 0;

    width: auto;

    height: 40px;

    border: 1px solid rgba(255,255,255,.06);

    outline: none;

    background: #1e293b;

    color: white;

    border-radius: 21px;

    padding: 0 15px;

    font-size: 14px;

    transition: .18s ease;
}

.input:focus {
    border-color: rgba(59,130,246,.55);

    background: #202c40;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.08);
}

.input::placeholder {
    color: #64748b;
}

.send {
    width: 42px;
    min-width: 42px;

    height: 42px;

    border: none;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #2563eb
        );

    color: white;

    border-radius: 50%;

    font-size: 19px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 5px 16px rgba(37,99,235,.28);

    transition: .18s ease;

    flex-shrink: 0;
}

.send:hover {
    transform: translateY(-1px) scale(1.04);

    box-shadow:
        0 7px 20px rgba(37,99,235,.36);
}

/* =========================
   MENU
========================= */

.menu {
    position: fixed;

    top: 73px;

    right: calc(50% - 270px);

    width: 220px;

    background: rgba(21,29,47,.98);

    border: 1px solid var(--border);

    border-radius: 14px;

    box-shadow:
        0 18px 45px rgba(0,0,0,.45);

    display: none;

    z-index: 100;

    overflow: hidden;

    backdrop-filter: blur(18px);
}

.menu.show {
    display: block;

    animation:
        menuIn .16s ease-out;
}

@keyframes menuIn {

    from {
        opacity: 0;
        transform:
            translateY(-5px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.menu button {
    width: 100%;

    padding: 13px 15px;

    border: none;

    background: transparent;

    color: #e2e8f0;

    text-align: left;

    cursor: pointer;

    font-size: 14px;

    transition: .15s ease;
}

.menu button:hover {
    background:
        rgba(59,130,246,.10);
}

.menu .danger {
    color: #f87171;
}

.menu .danger:hover {
    background:
        rgba(239,68,68,.09);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    html,
    body {
        width: 100%;

        height: 100%;
        height: 100dvh;

        overflow: hidden;
    }

    .chat-app {
        width: 100%;

        max-width: none;

        height: 100%;
        height: 100dvh;

        min-height: 0;

        border: none;

        box-shadow: none;
    }

    .header {
        height: 62px;

        min-height: 62px;

        padding: 8px 9px;
    }

    .avatar {
        width: 40px;
        height: 40px;

        margin-right: 9px;
    }

    .header-btn {
        width: 35px;
        height: 35px;

        font-size: 17px;
    }

    .messages {
        padding: 13px 10px;

        gap: 7px;
    }

    .message {
        max-width: 84%;

        padding: 9px 12px;

        font-size: 14px;
    }

    .input-area {
        width: 100%;

        min-height: 62px;

        padding: 7px 6px;

        padding-bottom:
            max(
                7px,
                env(safe-area-inset-bottom)
            );

        gap: 1px;
    }

    .tool {
        width: 35px;

        min-width: 35px;

        height: 38px;

        font-size: 17px;
    }

    .input {
        height: 38px;

        font-size: 16px;

        padding: 0 12px;
    }

    .send {
        width: 39px;

        min-width: 39px;

        height: 39px;

        font-size: 18px;
    }

    .menu {
        top: 62px;

        right: 10px;

        width: 220px;

        max-width:
            calc(100vw - 20px);
    }
}

/* =========================
   MOBILE KEYBOARD
========================= */

@media (max-width: 600px)
and (max-height: 500px) {

    .header {
        height: 54px;

        min-height: 54px;
    }

    .messages {
        padding-top: 7px;

        padding-bottom: 7px;
    }

    .input-area {
        min-height: 53px;

        padding-top: 4px;

        padding-bottom: 4px;
    }

    .tool,
    .input,
    .send {
        height: 35px;
    }

    .send {
        width: 36px;

        min-width: 36px;
    }

    .menu {
        top: 54px;
    }
}
</style>
</head>

<body>

<div class="chat-app">

    <!-- HEADER -->

    <div class="header">

        <div class="avatar">
            X
        </div>

        <div class="user-info">

            <div class="user-name">
                Xgame
            </div>

            <div class="status">
                Đang hoạt động
            </div>

        </div>

        <button class="header-btn">
            ☎
        </button>

        <button class="header-btn">
            ▬
        </button>

        <button
            class="header-btn"
            onclick="toggleMenu()">
            ⋯
        </button>

    </div>


    <!-- MESSAGES -->

    <div
        id="messages"
        class="messages">

        <div class="empty">
            Đang tải tin nhắn...
        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <button class="tool">
            🎤
        </button>

        <button class="tool">
            🖼️
        </button>

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Aa"
            autocomplete="off"
        >

        <button
            class="tool"
            onclick="sendEmoji()">
            😊
        </button>

        <button
            class="send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<!-- MENU -->

<div
    id="menu"
    class="menu">

    <button onclick="closeMenu()">
        ⚙️ Cài đặt
    </button>

    <button
        class="danger"
        onclick="deleteAllMessages()">

        🗑️ Xóa tất cả tin nhắn

    </button>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDcOZNhCEnL2izlTpe4Nxy4Jwtf7YNx89k",

    authDomain:
        "xgame-7ff37.firebaseapp.com",

    projectId:
        "xgame-7ff37",

    storageBucket:
        "xgame-7ff37.firebasestorage.app",

    messagingSenderId:
        "204757980002",

    appId:
        "1:204757980002:web:acdccd4c02be7be378923b"

};


/* =====================================================
   FIREBASE INIT
===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =====================================================
   COLLECTION
===================================================== */

const messagesRef =
    collection(
        db,
        "messages"
    );


/* =====================================================
   LOAD REALTIME MESSAGES
===================================================== */

const messagesBox =
    document.getElementById(
        "messages"
    );


const q = query(
    messagesRef,
    orderBy("time", "asc")
);


onSnapshot(q, (snapshot) => {

    messagesBox.innerHTML = "";

    if (snapshot.empty) {

        messagesBox.innerHTML = `
            <div class="empty">
                Chưa có tin nhắn
            </div>
        `;

        return;
    }


    snapshot.forEach((item) => {

        const data =
            item.data();


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message " +
            (
                data.type === "admin"
                    ? "admin"
                    : "user"
            );


        message.textContent =
            data.text || "";


        messagesBox.appendChild(
            message
        );

    });


    scrollBottom();

});


/* =====================================================
   SEND MESSAGE
===================================================== */

window.sendMessage =
async function () {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    try {

        await addDoc(
            messagesRef,
            {

                text: text,

                type: "admin",

                time:
                    serverTimestamp()

            }
        );


        input.value = "";

        input.focus();


    } catch (error) {

        console.error(error);

        alert(
            "Không gửi được tin nhắn!"
        );

    }

};


/* =====================================================
   ENTER TO SEND
===================================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =====================================================
   EMOJI
===================================================== */

window.sendEmoji =
function () {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value += " 😊";

    input.focus();

};


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom() {

    setTimeout(() => {

        messagesBox.scrollTop =
            messagesBox.scrollHeight;

    }, 50);

}


/* =====================================================
   MENU
===================================================== */

window.toggleMenu =
function () {

    document
        .getElementById("menu")
        .classList.toggle(
            "show"
        );

};


window.closeMenu =
function () {

    document
        .getElementById("menu")
        .classList.remove(
            "show"
        );

};


/* =====================================================
   DELETE ALL
===================================================== */

window.deleteAllMessages =
async function () {

    closeMenu();


    const confirmDelete =
        confirm(
            "Bạn có chắc muốn XÓA TẤT CẢ tin nhắn không?"
        );


    if (!confirmDelete)
        return;


    try {

        const snapshot =
            await getDocs(
                messagesRef
            );


        for (
            const item
            of snapshot.docs
        ) {

            await deleteDoc(
                doc(
                    db,
                    "messages",
                    item.id
                )
            );

        }


        alert(
            "Đã xóa tất cả tin nhắn!"
        );


    } catch (error) {

        console.error(error);

        alert(
            "Không thể xóa tin nhắn!"
        );

    }

};


/* =====================================================
   CLICK OUTSIDE MENU
===================================================== */

document.addEventListener(
    "click",
    function (event) {

        const menu =
            document.getElementById(
                "menu"
            );


        const button =
            event.target.closest(
                ".header-btn"
            );


        if (
            !menu.contains(
                event.target
            ) &&
            !button
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);

</script>

</body>
</html>
